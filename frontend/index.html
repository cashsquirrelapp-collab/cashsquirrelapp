<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/logo01-v1/favicon-clear-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/logo01-v1/favicon-clear-192.png" />
    <link rel="icon" href="/brand/logo01-v1/favicon-clear.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo01-v1/favicon-clear.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS meta tags for full PWA and home screen integration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Krarok" />
    <!-- Home screen icon: the white tail, as large as the earlier icon, on the brand rust (owner, 2026-10-22). -->
    <link rel="apple-touch-icon" href="/brand/home-v2/home-icon-180.png" />

    <!-- The tab shows the English name in both languages (owner, 2026-10-23), as the manifest does. -->
    <title>Krarok Tunngern</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Before the app's code arrives on a refresh, a signed-in user sees the opening logo (boot-skeleton.js) instead of a
         blank page; the app assembles it and fades it into the page (src/app/splash.ts). -->
    <style>
      /* The logo when the app opens and whenever it has to wait, on every device. Look A (owner, 2026-11-11, after the Dime
         clip: "อยากได้แบบนั้น"): a small mark breathes until the app's code arrives, then the logo assembles (src/app/splash.ts
         plays it) and the page shows through before the logo goes. Smooth (owner, 2026-11-11: "อยากได้แบบสมูทสมูท"): every
         moving part animates only transform and opacity, so the screen's compositor runs it while the app is still busy. */
      .splash{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding-bottom:6vh}
      .splash-bg{position:absolute;inset:0;background:#FAFAF9}
      .splash.dark .splash-bg{background:#17181B}
      @media (min-width:744px){.splash.dark .splash-bg{background:#000}}
      .splash-body{position:relative;display:flex;flex-direction:column;align-items:center}
      .splash-stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:58px;min-height:58px}
      .splash-wait{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;opacity:0;animation:splashFade .3s ease-out forwards,splashBreathe 1.4s ease-in-out infinite}
      .splash.is-static .splash-wait{display:none}
      .splash-orbit{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;perspective:600px;pointer-events:none}
      .splash-arc{display:block;width:100%;height:100%;overflow:visible;opacity:0}
      .splash-arc circle{fill:none;stroke:#E65F2B;stroke-width:7;stroke-linecap:round;stroke-dasharray:34 66}
      .splash.dark .splash-arc circle{stroke:#FF7A45}
      .splash-lock{display:flex;align-items:center;gap:10px}
      .splash-slot{position:relative;flex:none;width:58px;height:58px}
      .splash-mark{display:block;width:100%;height:100%;opacity:0}
      .splash-dot{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#E65F2B;opacity:0}
      .splash-name{display:flex;font:600 30px/1.5 'Prompt','IBM Plex Sans Thai',sans-serif;letter-spacing:-.2px;color:#1C1917;perspective:420px}
      .splash.dark .splash-name{color:#F5F5F4}
      .splash-name span{display:inline-block;opacity:0}
      .splash-name .is-orange{color:#E65F2B}
      .splash.dark .splash-name .is-orange{color:#FF7A45}
      .splash.is-static .splash-mark,.splash.is-static .splash-name span{opacity:1}
      .splash-wait,.splash-arc,.splash-mark,.splash-dot,.splash-name span{will-change:transform,opacity}
      .splash-dots{display:flex;gap:7px;margin-top:26px;opacity:0}
      .splash.is-long .splash-dots{animation:splashFade .4s ease forwards}
      .splash-dots i{display:block;width:6px;height:6px;border-radius:50%;background:#E65F2B;opacity:.25;animation:splashDot 1.1s ease-in-out infinite}
      .splash.dark .splash-dots i{background:#FF7A45}
      .splash-dots i:nth-child(2){animation-delay:.15s}
      .splash-dots i:nth-child(3){animation-delay:.3s}
      .splash-caption{margin:18px 0 0;padding:0 24px;font:500 14px/1.5 'IBM Plex Sans Thai',sans-serif;color:#78716C;text-align:center;opacity:0;animation:splashFade .4s ease .6s forwards}
      .splash.dark .splash-caption{color:#A8A29E}
      .splash.is-leaving{pointer-events:none}
      .splash.is-leaving .splash-bg{opacity:0;transition:opacity .5s cubic-bezier(.4,0,.2,1)}
      .splash.is-leaving .splash-body{animation:splashOut .38s cubic-bezier(.33,0,.2,1) .2s forwards}
      @keyframes splashFade{to{opacity:1}}
      @keyframes splashBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      @keyframes splashDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
      @keyframes splashOut{to{opacity:0;transform:scale(1.04)}}
      @media (prefers-reduced-motion:reduce){.splash-wait{animation:splashFade .3s forwards}.splash-orbit,.splash-dot{display:none}.splash-dots i{animation:none;opacity:.6}.splash.is-leaving .splash-body{animation:none;opacity:0;transition:opacity .3s ease}}
    </style>
    <script src="/boot-skeleton.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
