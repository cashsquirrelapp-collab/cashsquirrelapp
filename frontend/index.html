<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/logo01-v1/favicon-clear-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/logo01-v1/favicon-clear-192.png" />
    <link rel="icon" href="/brand/logo01-v1/favicon-clear.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" type="image/svg+xml" href="/brand/logo01-v1/favicon-clear.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS meta tags for full PWA and home screen integration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Krarok" />
    <!-- Home screen icon: the white tail, as large as the earlier icon, on the brand rust (owner, 2026-10-22). -->
    <link rel="apple-touch-icon" href="/brand/home-v2/home-icon-180.png" />

    <!-- The tab shows the English name in both languages (owner, 2026-10-23), as the manifest does. -->
    <title>Krarok Tunngern</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Before the app's code arrives on a refresh, a signed-in user sees the opening logo (boot-skeleton.js) instead of a
         blank page; the app fades it into the page (src/app/splash.ts). -->
    <style>
      /* The logo when the app opens (phones since 2026-10-22, computers and iPads since 2026-11-11), see boot-skeleton.js and src/app/splash.ts. */
      .splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:6vh;background:#FAFAF9;transition:opacity .45s ease,visibility .45s}
      .splash.dark{background:#17181B}
      .splash-stage{position:relative;display:grid;place-items:center;width:150px;height:150px}
      .splash-glow{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,rgba(230,95,43,.24) 0%,rgba(230,95,43,.08) 42%,rgba(230,95,43,0) 68%);opacity:0;transform:scale(.4);animation:splashGlow 1.2s cubic-bezier(.2,.8,.2,1) .05s forwards}
      .splash-ring{position:absolute;inset:22px;border-radius:50%;border:2px solid rgba(230,95,43,.42);opacity:0;animation:splashRing 1.5s cubic-bezier(.2,.7,.3,1) .5s forwards}
      .splash-ring.is-late{animation-delay:.85s;border-width:1.5px}
      .splash-mark{position:relative;width:92px;height:92px;opacity:0;transform:scale(.55) rotate(-18deg);filter:drop-shadow(0 12px 24px rgba(230,95,43,.3));animation:splashIn .9s cubic-bezier(.2,1.35,.35,1) .05s forwards,splashBreathe 2.4s ease-in-out 1.15s infinite}
      .splash-name{margin-top:14px;font:600 25px/1.2 'Prompt','IBM Plex Sans Thai',sans-serif;letter-spacing:-.2px;color:#1C1917;opacity:0;transform:translateY(10px)}
      .splash.dark .splash-name{color:#F5F5F4}
      .splash-name em{font-style:normal;color:#E65F2B}
      .splash.dark .splash-name em{color:#FF7A45}
      .splash.has-name .splash-name{animation:splashUp .6s cubic-bezier(.2,.8,.2,1) .35s forwards}
      .splash-dots{display:flex;gap:7px;margin-top:26px;opacity:0;animation:splashFade .4s ease 1.2s forwards}
      .splash-dots i{display:block;width:6px;height:6px;border-radius:50%;background:#E65F2B;opacity:.25;animation:splashDot 1.1s ease-in-out infinite}
      .splash.dark .splash-dots i{background:#FF7A45}
      .splash-dots i:nth-child(2){animation-delay:.15s}
      .splash-dots i:nth-child(3){animation-delay:.3s}
      .splash-caption{margin:18px 0 0;padding:0 24px;font:500 14px/1.5 'IBM Plex Sans Thai',sans-serif;color:#78716C;text-align:center;opacity:0;animation:splashFade .4s ease .6s forwards}
      .splash.dark .splash-caption{color:#A8A29E}
      /* Already on screen once in this visit (LINE's page before the app, or an earlier wait): the logo as its entrance ends,
         never the entrance again (owner, 2026-11-14: "เด้งหน้าโหลดประมาณ 3 หน้า ... เอาหน้าเดียวไปเลย"). */
      .splash.is-settled .splash-glow{opacity:.9;transform:none;animation:none}
      .splash.is-settled .splash-ring{opacity:0;animation:none}
      .splash.is-settled .splash-mark{opacity:1;transform:none;animation:splashBreathe 2.4s ease-in-out infinite}
      .splash.is-settled .splash-name{opacity:1;transform:none;animation:none}
      .splash.is-settled .splash-dots,.splash.is-settled .splash-caption{opacity:1;animation:none}
      .splash.is-leaving{opacity:0;visibility:hidden}
      .splash.is-leaving .splash-stage{animation:splashOut .45s cubic-bezier(.4,0,.2,1) forwards}
      @keyframes splashIn{0%{opacity:0;transform:scale(.55) rotate(-18deg)}55%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0)}}
      @keyframes splashBreathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:1;transform:scale(1.045)}}
      @keyframes splashGlow{0%{opacity:0;transform:scale(.4)}60%{opacity:1}100%{opacity:.9;transform:scale(1)}}
      @keyframes splashRing{0%{opacity:.7;transform:scale(.72)}100%{opacity:0;transform:scale(1.5)}}
      @keyframes splashUp{to{opacity:1;transform:none}}
      @keyframes splashFade{to{opacity:1}}
      @keyframes splashDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
      @keyframes splashOut{to{transform:scale(1.18)}}
      @media (prefers-reduced-motion:reduce){.splash-mark{opacity:1;transform:none;animation:none}.splash-glow,.splash-ring{display:none}.splash.has-name .splash-name{animation:splashFade .3s forwards;transform:none}.splash-dots i{animation:none;opacity:.6}.splash.is-leaving .splash-stage{animation:none}}
    </style>
    <script src="/boot-skeleton.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
