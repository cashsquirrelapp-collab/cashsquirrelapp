<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- The LINE menu for people who have not signed up (owner, 2026-11-13): เริ่มใช้งาน first, then คุยกับเลขา and รู้จักกระรอก.
     2500x843 (LINE's compact size). Flat brick on a neutral ground (owner, 2026-11-12: no gradients, no cream); the official
     squirrel picture (/line/mascot-v6-guide.png), never redrawn. Rendered by scripts/line-menu/render-guest.mjs. -->
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@600&family=IBM+Plex+Sans+Thai:wght@500;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2500px; height: 843px; background: #F2F1EF; overflow: hidden; }
  .tile { position: absolute; border-radius: 48px; overflow: hidden; }
  .start { left: 24px; top: 24px; width: 1300px; height: 795px; background: #E65F2B; color: #FFFFFF; padding: 84px 0 0 92px; }
  .start h1 { font: 600 176px/1.2 'Prompt', sans-serif; letter-spacing: -2px; }
  .start p { margin-top: 18px; font: 600 66px/1.45 'IBM Plex Sans Thai', sans-serif; color: #FFFFFF; }
  .start .tap { display: inline-flex; align-items: center; gap: 22px; margin-top: 64px; padding: 26px 54px; border-radius: 999px; background: #FFFFFF; color: #B8461C; font: 600 62px/1.2 'IBM Plex Sans Thai', sans-serif; }
  .start .tap svg { width: 58px; height: 58px; }
  .start img { position: absolute; right: -20px; bottom: -64px; width: 470px; height: 470px; }
  .small { left: 1348px; width: 1128px; height: 385px; background: #FFFFFF; padding: 70px 0 0 80px; color: #1C1917; }
  .chat { top: 24px; }
  .about { top: 433px; height: 386px; }
  .small h2 { font: 600 120px/1.2 'Prompt', sans-serif; letter-spacing: -1px; }
  .small p { margin-top: 14px; font: 500 60px/1.45 'IBM Plex Sans Thai', sans-serif; color: #57534E; }
  .icon { position: absolute; right: 70px; top: 50%; transform: translateY(-50%); width: 200px; height: 200px; border-radius: 50%; background: #FCE9E0; display: grid; place-items: center; }
  .icon svg { width: 104px; height: 104px; }
</style>
</head>
<body>
  <div class="tile start">
    <h1>เริ่มใช้งาน</h1>
    <p>สมัครในแตะเดียว ไม่ต้องใช้อีเมล</p>
    <span class="tap">แตะที่นี่
      <svg viewBox="0 0 24 24" fill="none" stroke="#B8461C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </span>
    <img src="../../frontend/public/line/mascot-v6-guide.png" alt="">
  </div>
  <div class="tile small chat">
    <h2>คุยกับเลขา</h2>
    <p>ลองพิมพ์ “ค่ากาแฟ 60”</p>
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#C24A16" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01" stroke-width="3"/></svg></span>
  </div>
  <div class="tile small about">
    <h2>รู้จักกระรอก</h2>
    <p>ดูว่าเลขาช่วยอะไรได้บ้าง</p>
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#C24A16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
  </div>
</body>
</html>
